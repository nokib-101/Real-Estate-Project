{% extends 'base.html' %}

{% block title %}Log in{% endblock %}

{% block content %}
  <div class="auth-wrap">
    <div class="auth-form">
      <div class="inner">
        <h1 class="h2 mb-1">Welcome back</h1>
        <p class="text-muted mb-4">Log in to see the homes you've asked about.</p>
        <form action="{% url 'login' %}" method="POST">
          {% csrf_token %}
          <input type="hidden" name="next" value="{{ request.GET.next }}">
          <div class="mb-3">
            <label class="form-label" for="username">Username</label>
            <input id="username" type="text" name="username" class="form-control" autocomplete="username" required autofocus>
          </div>
          <div class="mb-4">
            <label class="form-label" for="password">Password</label>
            <input id="password" type="password" name="password" class="form-control" autocomplete="current-password" required>
          </div>
          <button type="submit" class="btn btn-primary w-100">Log in</button>
        </form>
        <p class="text-muted mt-4 mb-0 text-center">New here? <a href="{% url 'register' %}">Create a free account</a></p>
      </div>
    </div>
    <div class="auth-art" aria-hidden="true">
      <blockquote>"The easiest home search we've ever had."</blockquote>
    </div>
  </div>
{% endblock %}
