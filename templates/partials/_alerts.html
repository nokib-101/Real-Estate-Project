{% if messages %}
<div class="toast-stack" role="status" aria-live="polite">
  {% for message in messages %}
    <div class="toast-msg {{ message.tags }}">
      <span class="toast-icon">
        {% if message.tags == 'success' %}<i class="fas fa-check-circle"></i>{% elif message.tags == 'danger' %}<i class="fas fa-exclamation-circle"></i>{% else %}<i class="fas fa-info-circle"></i>{% endif %}
      </span>
      <div>{{ message }}</div>
      <button type="button" class="btn-close" aria-label="Close"></button>
    </div>
  {% endfor %}
</div>
{% endif %}
