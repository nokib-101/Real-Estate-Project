{% with path=request.path %}
<nav class="navbar navbar-expand-lg site-nav">
  <div class="container">
    <a class="brand" href="{% url 'index' %}">
      <span class="brand-mark"><i class="fas fa-home"></i></span> BT Real Estate
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav"
            aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">
      <i class="fas fa-bars fa-lg text-ink"></i>
    </button>
    <div class="collapse navbar-collapse" id="mainNav">
      <ul class="navbar-nav ms-lg-4 me-auto">
        <li class="nav-item"><a class="nav-link {% if path == '/' %}active{% endif %}" href="{% url 'index' %}">Home</a></li>
        <li class="nav-item"><a class="nav-link {% if '/listings' in path %}active{% endif %}" href="{% url 'listings' %}">Listings</a></li>
        <li class="nav-item"><a class="nav-link {% if '/about' in path %}active{% endif %}" href="{% url 'about' %}">About</a></li>
      </ul>
      <ul class="navbar-nav align-items-lg-center gap-lg-1">
        {% if user.is_authenticated %}
          <li class="nav-item">
            <a class="nav-link user-chip {% if 'dashboard' in path %}active{% endif %}" href="{% url 'dashboard' %}">
              <span class="avatar">{{ user.first_name|default:user.username|first|upper }}</span> Dashboard
            </a>
          </li>
          <li class="nav-item">
            <form action="{% url 'logout' %}" method="POST" class="m-0">
              {% csrf_token %}
              <button type="submit" class="nav-link border-0 bg-transparent"><i class="fas fa-sign-out-alt me-1"></i> Log out</button>
            </form>
          </li>
        {% else %}
          <li class="nav-item"><a class="nav-link {% if 'login' in path %}active{% endif %}" href="{% url 'login' %}">Log in</a></li>
          <li class="nav-item"><a class="btn btn-primary ms-lg-2" href="{% url 'register' %}">Sign up</a></li>
        {% endif %}
      </ul>
    </div>
  </div>
</nav>
{% endwith %}
