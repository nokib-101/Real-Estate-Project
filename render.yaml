# Render Blueprint: a free Django web service. The database is a free Neon
# Postgres (neon.tech), which doesn't expire like Render's free database.
# In Render: New > Blueprint > pick this repository; when asked, paste the
# Neon connection string as DATABASE_URL.

services:
  - type: web
    name: btre-real-estate
    runtime: python
    plan: free
    buildCommand: ./build.sh
    # Migrations and demo data run at start (they need the database, and the
    # free plan wipes files written at runtime, so demo photos are re-copied)
    startCommand: python manage.py migrate --no-input && python manage.py seed_demo && gunicorn btre.wsgi:application
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      # Neon connection string, e.g. postgresql://user:pass@ep-xxx.region.aws.neon.tech/neondb?sslmode=require
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: WEB_CONCURRENCY
        value: 2
      - key: DJANGO_SUPERUSER_USERNAME
        value: admin
      - key: DJANGO_SUPERUSER_PASSWORD
        generateValue: true
      # From the Cloudinary dashboard: cloudinary://<api_key>:<api_secret>@<cloud_name>
      # Stores uploaded photos so they survive restarts on the free plan.
      - key: CLOUDINARY_URL
        sync: false
